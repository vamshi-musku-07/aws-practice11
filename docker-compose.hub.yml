# Deploy by pulling images from Docker Hub (no local build of frontend/backend).
#
#   docker compose --env-file .env.hub -f docker-compose.hub.yml pull
#   docker compose --env-file .env.hub -f docker-compose.hub.yml up -d

services:
  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - todo-net
    environment:
      MONGO_INITDB_DATABASE: todo-app
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${DOCKERHUB_USERNAME}/${BACKEND_IMAGE:-todo-backend}:${IMAGE_TAG:-latest}
    container_name: todo-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: "*"
      MONGODB_URI: mongodb://mongo:27017/todo-app
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - todo-net
    restart: unless-stopped
    pull_policy: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE:-todo-frontend}:${IMAGE_TAG:-latest}
    container_name: todo-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - todo-net
    restart: unless-stopped
    pull_policy: always

volumes:
  mongo_data:
    name: todo-mongo-data

networks:
  todo-net:
    name: todo-net
    driver: bridge
